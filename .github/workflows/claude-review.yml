# Claude reviews each pull request. Needs the CLAUDE_CODE_OAUTH_TOKEN repo
# secret (from `claude setup-token`) and the Claude GitHub App installed.
# Model is pinned on the --model line; add "synchronize" below to also
# re-review every push to an open PR (costs a run each time).
name: Claude Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for bugs, correctness, thread-safety, and clarity.
            Repository: ${{ github.repository }}
            PR #: ${{ github.event.pull_request.number }}
            Read the diff with `gh pr diff`, then post specific findings as inline
            comments on the affected lines. Focus on real issues, not style nits.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep"
            --model claude-haiku-4-5-20251001
