# Claude reviews each pull request. Needs the CLAUDE_CODE_OAUTH_TOKEN repo
# secret (from `claude setup-token`) and the Claude GitHub App installed.
# Two knobs: the model on the --model line, and the trigger events below.
name: Claude Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model claude-haiku-4-5-20251001 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
